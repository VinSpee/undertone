# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "undertone-protocol"
description = "The pedal's USB protocols as tools/uboot_rescue.py, tools/uboot_install.py and tools/pd40_recovery.py speak them, without USB code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# the simulated pedals of src/sim.rs, for the program's own tests
sim = []

[dependencies]
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
undertone-protocol = { path = ".", features = ["sim"] }
serde_json = "=1.0.154"
