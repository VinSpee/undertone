# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "undertone"
description = "Rescue, install or check a BlackBox over its USB cable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
undertone-protocol = { path = "../protocol" }
clap = { version = "=4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

# macOS and Linux reach the pedal through libusb, built from source into the program (no Homebrew, no system library).
# Windows does not: it sends the same SCSI commands through Windows' own mass-storage driver (DESIGN.md, "Windows").
[target.'cfg(not(windows))'.dependencies]
rusb = { version = "=0.9.4", features = ["vendored"] }

[lints]
workspace = true
