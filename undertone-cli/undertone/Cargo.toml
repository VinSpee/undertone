# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "undertone"
description = "Rescue, install or check a BlackBox over its USB cable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
undertone-protocol = { path = "../protocol" }
clap = { version = "=4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# the guided screens
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
# Ctrl-C during a write in the plain view (src/tui/plain.rs), on macOS, Linux and Windows alike
ctrlc = "=3.5.3"
# the local time in a backup's name, as tools/uboot_rescue.py names it
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

# macOS and Linux reach the pedal through libusb, built from source into the program (no Homebrew, no system library).
# Windows does not: it sends the same SCSI commands through Windows' own mass-storage driver (DESIGN.md, "Windows").
[target.'cfg(not(windows))'.dependencies]
rusb = { version = "=0.9.4", features = ["vendored"] }

[features]
# UNDERTONE_SIM=rescue|install|check runs the guided screens against a simulated pedal (src/tui/sim.rs), for the
# pseudo-terminal run of the screens; never in a release
sim = ["undertone-protocol/sim"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_System_IO",
    "Win32_UI_Shell",
] }

[dev-dependencies]
undertone-protocol = { path = "../protocol", features = ["sim"] }
serde_json = "=1.0.154"

[lints]
workspace = true
